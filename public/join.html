<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- interactive-widget: the on-screen keyboard overlays the page instead of resizing it -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=overlays-content">
<meta name="theme-color" content="#0b0f17">
<title>Lock Back</title>
<style>
  :root { --a:#3b82f6; --b:#f59e0b; --bg:#0b0f17; --card:#161d2b; --line:#27324a; --text:#eef2f8; --muted:#8b97ab; --tc:#7aa7ff; }
  body.tA { --tc:var(--a); } body.tB { --tc:var(--b); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  /* everything is sized in rem, and rem scales with the screen */
  html { font-size:clamp(14px, calc(0.9vw + 1.5dvh), 22px); height:100%; }
  body { height:100%; margin:0; overflow:hidden; overscroll-behavior:none;
         background:radial-gradient(120% 70% at 50% 0%, #1a2540 0%, var(--bg) 60%); color:var(--text);
         font-family:system-ui,-apple-system,"Segoe UI",sans-serif; user-select:none; -webkit-user-select:none; touch-action:manipulation; }
  body.locked { background:radial-gradient(120% 80% at 50% 30%, #e11d1d 0%, #8f1111 80%); }
  .app { height:100vh; height:100dvh; width:100%; max-width:36rem; margin:0 auto;
         padding:.7rem .9rem calc(.7rem + env(safe-area-inset-bottom));
         display:flex; flex-direction:column; gap:.7rem; text-align:center; }
  .hide { display:none !important; }
  .view { flex:1; min-height:0; display:flex; flex-direction:column; gap:.7rem; }
  .spacer { flex:1; min-height:0; }
  .muted { color:var(--muted); } body.locked .muted { color:#ffd0d0; }

  .top { display:flex; align-items:center; justify-content:space-between; }
  .brand { font-weight:800; font-size:1.1rem; }
  .topBtns { display:flex; gap:.4rem; align-items:center; }
  #helpBtn { width:2rem; height:2rem; padding:0; border:0; border-radius:50%; background:#243049; color:var(--text); font-size:1.1rem; font-weight:800; cursor:pointer; }
  #help { display:none; position:fixed; inset:0; z-index:50; background:rgba(5,8,14,.88); align-items:center; justify-content:center; padding:.8rem; }
  #help.show { display:flex; }
  #help .box { width:100%; max-width:34rem; max-height:100%; overflow:auto; background:var(--card); border:2px solid var(--line); border-radius:1.2rem; padding:1rem 1.1rem; text-align:start; user-select:text; -webkit-user-select:text; }
  #help h2 { margin:0 0 .6rem; font-size:1.3rem; }
  #help p { margin:0 0 .7rem; line-height:1.5; font-size:1rem; }
  #help .pics { display:flex; gap:.5rem; justify-content:center; margin:-.2rem 0 .8rem; }
  #help figure { margin:0; flex:1; max-width:5.5rem; text-align:center; }
  #help figure img { width:100%; aspect-ratio:1; object-fit:contain; display:block; }
  #help figcaption { font-size:.75rem; font-weight:700; color:var(--muted); line-height:1.2; }
  #help .plate { display:block; aspect-ratio:1; border-radius:50%; background:radial-gradient(circle at 50% 35%, #334155, #0b1220 75%); border:.2rem solid var(--ring); padding:12%; box-sizing:border-box; }
  #help .plate .fxs { display:block; width:100%; aspect-ratio:1; background-size:400% 100%; background-repeat:no-repeat; }
  #help .plate img { width:100%; height:100%; object-fit:contain; display:block; }
  #help .pics.wide figure { max-width:9rem; }
  #helpClose { display:block; width:100%; margin-top:.4rem; padding:.7rem; border:0; border-radius:.9rem; background:linear-gradient(160deg,#34d399,#16a34a); color:#03200f; font-weight:800; font-size:1.05rem; cursor:pointer; }
  #langBtn { background:#243049; color:var(--text); border:0; border-radius:99px; padding:.4rem .8rem; font-size:.9rem; font-weight:600; cursor:pointer; }

  /* join */
  .teams { display:flex; gap:.7rem; }
  .teams button { flex:1; padding:1rem 0; font-size:1.2rem; font-weight:800; border:3px solid transparent; border-radius:1rem; color:#fff; cursor:pointer; opacity:.5; transition:.15s; }
  .teams button[data-t=A], .chip.A { background:linear-gradient(160deg,#4f93ff,#2563eb); }
  .teams button[data-t=B], .chip.B { background:linear-gradient(160deg,#fbbf24,#d97706); }
  .teams button.sel { opacity:1; border-color:#fff; transform:scale(1.03); }
  #name { width:100%; padding:.75rem; font-size:16px; border-radius:.8rem; border:2px solid var(--line); background:#0e1420; color:var(--text); text-align:center; user-select:text; -webkit-user-select:text; }
  #name:focus { outline:none; border-color:var(--tc); }
  .err { color:#ff8585; min-height:1.3em; font-size:.95rem; }
  .go { padding:.9rem; font-size:1.2rem; font-weight:800; border:0; border-radius:.9rem; background:linear-gradient(160deg,#34d399,#16a34a); color:#03200f; cursor:pointer; box-shadow:0 6px 18px rgba(34,197,94,.25); }
  .go:active { transform:scale(.98); }

  /* code boxes */
  .boxes { display:flex; gap:.7rem; justify-content:center; direction:ltr; }
  .boxes div { width:clamp(3rem, 18vw, 4.6rem); height:clamp(3.4rem, 8.5dvh, 5.2rem); border-radius:.9rem; background:#0e1420; border:2px solid var(--line);
               font-size:2.4rem; font-weight:800; display:flex; align-items:center; justify-content:center; transition:border-color .12s; }
  .boxes div.cur { border-color:var(--tc); box-shadow:0 0 0 3px color-mix(in srgb, var(--tc) 30%, transparent); }
  .boxes div.filled { animation:pop .15s ease-out; }
  .boxes.shake { animation:shake .35s; }
  @keyframes pop { 0% { transform:scale(.8); } 100% { transform:scale(1); } }
  @keyframes shake { 20%,60% { transform:translateX(-7px); } 40%,80% { transform:translateX(7px); } }
  @keyframes blink { 50% { opacity:.55; } }

  /* game */
  .roundPill { align-self:center; padding:.35rem 1.1rem; border-radius:99px; background:#1d2740; font-weight:800; font-size:1.05rem; }
  body.locked .roundPill { background:rgba(0,0,0,.25); }
  .me { display:flex; align-items:center; justify-content:center; gap:.5rem; font-size:.95rem; }
  .chip { padding:.15rem .8rem; border-radius:99px; font-weight:800; color:#fff; }
  .scores { display:flex; gap:.7rem; }
  .sc { flex:1; background:var(--card); border-radius:1rem; padding:.45rem .2rem; border:2px solid transparent; border-top:4px solid var(--c); position:relative; }
  .sc.A { --c:var(--a); } .sc.B { --c:var(--b); }
  .sc.mine { border-color:var(--c); }
  .sc small { display:block; color:var(--muted); font-weight:600; font-size:.85rem; }
  .sc b { font-size:2.2rem; line-height:1.1; display:block; font-variant-numeric:tabular-nums; }
  .sc .you { position:absolute; top:-.6rem; inset-inline-end:.5rem; background:var(--c); color:#fff; font-size:.65rem; font-weight:800; padding:.05rem .5rem; border-radius:99px; }
  .sc.bump b { animation:pop .3s; }
  .sc .wins { display:block; font-size:.9rem; font-weight:800; color:#fbbf24; }
  .resultCard { width:100%; background:var(--card); border-radius:1rem; padding:.55rem .6rem; border:2px solid var(--line); }
  .resultCard.won { border-color:#22c55e; background:rgba(34,197,94,.12); } .resultCard.lost { border-color:#ef4444; background:rgba(239,68,68,.1); }
  .rTitle { font-size:.85rem; color:var(--muted); }
  .rScores { display:flex; justify-content:center; align-items:center; gap:1.2rem; direction:ltr; margin:.1rem 0; }
  .rScores b { font-size:2.4rem; line-height:1.1; font-variant-numeric:tabular-nums; } .rScores .A b { color:#7ab0ff; } .rScores .B b { color:#fbbf24; }
  .rScores span { font-size:1.6rem; color:var(--muted); }
  .rVerdict { font-weight:800; }
  body.locked .sc { background:rgba(0,0,0,.25); }

  .panel { flex:1; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.6rem; }
  #live, #lockMsg { width:100%; display:flex; flex-direction:column; align-items:center; gap:.6rem; }
  .timer { font-size:clamp(2.6rem, 8dvh, 4.6rem); font-weight:800; font-variant-numeric:tabular-nums; line-height:1; }
  .timer.low { color:#ff6b6b; animation:blink 1s infinite; }
  .bar { width:80%; height:.5rem; border-radius:99px; background:#1d2740; overflow:hidden; }
  body.locked .bar { background:rgba(0,0,0,.3); }
  .bar i { display:block; height:100%; width:100%; background:var(--tc); border-radius:99px; transition:width .25s linear; }
  body.locked .bar i { background:#fff; }
  .big { font-size:1.4rem; font-weight:800; }
  .lockWhy { font-weight:900; font-size:clamp(1.05rem, 3dvh, 1.4rem); text-align:center; color:#fff; }
  .lockHead { display:flex; align-items:center; justify-content:center; gap:.7rem; flex-wrap:wrap; }
  .lockSec { font-size:clamp(2.2rem, 6.5dvh, 3.8rem); font-weight:900; font-variant-numeric:tabular-nums; line-height:1; }
  .numCard { width:100%; background:rgba(0,0,0,.3); border:2px dashed rgba(255,255,255,.5); border-radius:1.2rem; padding:.6rem .5rem; }
  .numCard small { display:block; color:#ffd9d9; font-size:.9rem; }
  .numCard b { display:block; direction:ltr; font-size:clamp(3.4rem, min(15vw, 10dvh), 7rem); line-height:1.05; letter-spacing:.12em; padding-inline-start:.12em; font-weight:900; font-variant-numeric:tabular-nums; }
  /* locked: the number takes the whole screen so teammates can read it from across the room */
  body.locked .scores, body.locked .me, body.locked #keypad, body.locked #miniNum, body.locked #hud { display:none; }
  body.locked .view, body.locked .panel { gap:.5rem; }
  body.locked #lockMsg { flex:1; min-height:0; gap:.5rem; }
  body.locked .numCard { flex:1; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#fff; border:0; border-radius:1.2rem; padding:.4rem; }
  body.locked .numCard small { color:#7f1d1d; font-weight:800; font-size:clamp(.95rem, 2.6dvh, 1.4rem); }
  body.locked .numCard b { color:#b91c1c; font-size:min(30vw, 34dvh, 11rem); letter-spacing:.02em; padding:0; line-height:1; }
  .fb { min-height:2.6em; display:flex; align-items:center; justify-content:center; padding:.4rem .9rem; border-radius:.8rem; font-weight:700; max-width:100%; opacity:0; transition:opacity .2s; }
  .fb.show { opacity:1; animation:pop .2s ease-out; }
  .fb.good { background:rgba(34,197,94,.18); color:#4ade80; } .fb.bad { background:rgba(239,68,68,.2); color:#ff9b9b; } .fb.info { background:rgba(148,163,184,.15); color:#cbd5e1; }
  body.locked .fb { background:rgba(0,0,0,.28); color:#fff; }
  /* bombs: an alarm row for every active bomb (red = aimed at us, green = ours) */
  #bombBar { width:100%; display:flex; flex-direction:column; gap:.3rem; }
  #bombBar .bRow { display:flex; align-items:center; gap:.6rem; padding:.3rem .7rem; border-radius:.8rem; font-weight:800; text-align:start; font-size:.95rem; }
  #bombBar .bRow img { width:2.6rem; height:2.6rem; object-fit:contain; flex:none; }
  #bombBar .tag { font-size:.82rem; }
  /* 3 or 4 bombs at once: a small grid, no emoji */
  #bombBar.mini { display:grid; grid-template-columns:1fr 1fr; gap:.3rem; }
  #bombBar .bTile { display:flex; align-items:center; gap:.4rem; padding:.2rem .5rem; border-radius:.7rem; font-weight:800; font-size:.8rem; line-height:1.15; text-align:start; }
  #bombBar .bTile img { width:1.9rem; height:1.9rem; object-fit:contain; flex:none; }
  #bombBar .bTile.ours { border-width:1px; }
  #bombBar .alarm { background:#b91c1c; color:#fff; animation:alarm .6s infinite alternate; }
  #bombBar .ours { background:rgba(34,197,94,.18); color:#4ade80; border:2px solid #22c55e; }
  @keyframes alarm { to { background:#ef4444; box-shadow:0 0 1.4rem #ef4444; } }
  /* game over: no returns left. A dark see-through layer over the whole game with only the round time, a skull and "Game over" */
  #over { display:none; position:fixed; inset:0; z-index:45; flex-direction:column; align-items:center; justify-content:center; gap:1rem; text-align:center; padding:1rem; background:rgba(0,0,0,.93); backdrop-filter:blur(6px); }
  #over.show { display:flex; animation:overIn .8s ease-out 1.3s both; }
  #over .ovTime { font-size:clamp(2.6rem, 10dvh, 5rem); font-weight:900; font-variant-numeric:tabular-nums; line-height:1; color:#e5e7eb; }
  #over .ovTime.low { color:#ff6b6b; }
  #over .ovSkull { width:min(42vw, 22dvh, 11rem); aspect-ratio:1; filter:drop-shadow(0 0 1.5rem rgba(255,255,255,.25)); }
  #over .ovText { font-size:clamp(1.8rem, 7dvh, 3rem); font-weight:900; letter-spacing:.08em; color:#ef4444; text-shadow:0 0 1.2rem rgba(239,68,68,.6); }
  #over .ovHint { color:#9ca3af; font-size:1rem; max-width:22rem; }
  @keyframes overIn { from { opacity:0; } to { opacity:1; } }
  #boom { position:fixed; inset:0; z-index:40; display:flex; align-items:center; justify-content:center; font-size:min(70vw, 40dvh); pointer-events:none; opacity:0; background:rgba(255,120,20,.35); }
  #boom.fx { animation:boom .9s ease-out; }
  @keyframes boom { 0% { opacity:1; transform:scale(.3); } 40% { opacity:1; transform:scale(1.1); } 100% { opacity:0; transform:scale(1.4); } }
  body.locked #bombBar, body.locked #bombInfo, body.locked #log { display:none; }
  /* message log: stays on screen, newest first, as many lines as fit */
  #running { justify-content:flex-start; }
  #log { flex:1; min-height:0; width:100%; overflow:hidden; display:flex; flex-direction:column; gap:.4rem; }
  #log div { flex:none; padding:.45rem .8rem; border-radius:.8rem; font-weight:700; text-align:center; opacity:.55; }
  #log div:first-child { opacity:1; animation:pop .2s ease-out; }
  #log .good { background:rgba(34,197,94,.18); color:#4ade80; } #log .bad { background:rgba(239,68,68,.2); color:#ff9b9b; } #log .info { background:rgba(148,163,184,.15); color:#cbd5e1; }
  .lives { font-weight:800; font-size:.95rem; }
  .livesLine { font-weight:800; font-size:1.05rem; }
  .mini { margin:0; font-size:.85rem; color:var(--muted); }

  /* keypad: fills a share of the height, buttons stretch to fit */
  #keypad { flex:0 0 clamp(10rem, 34dvh, 24rem); display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(4,1fr); gap:.55rem; direction:ltr; }
  #keypad button { font-size:clamp(1.4rem, 4.2dvh, 2.2rem); font-weight:700; border:0; border-radius:1rem; background:#222d47; color:var(--text); cursor:pointer; box-shadow:0 2px 0 rgba(0,0,0,.35); }
  #keypad button:active { background:#34456c; transform:translateY(1px); }
  #keypad.off { opacity:.3; pointer-events:none; }
  #keypad .del { background:#3a2733; font-size:1.3rem; }
  /* Laptops/desktops (mouse + hardware keyboard): hide the keypad, typing still works via keydown. */
  @media (hover:hover) and (pointer:fine) { #keypad { display:none; } }

  /* phone held sideways: info on one side, keypad on the other */
  @media (orientation:landscape) and (max-height:520px) and (pointer:coarse) {
    .app { max-width:none; display:grid; grid-template-columns:1fr minmax(15rem, 42%); grid-template-rows:auto 1fr; gap:.5rem .9rem; }
    .top { grid-column:1 / -1; }
    .view { grid-column:1; grid-row:2; gap:.4rem; }
    #keypad { grid-column:2; grid-row:2; flex:none; }
    .boxes div { height:3.2rem; }
    .scores .sc b { font-size:1.6rem; }
    body.locked .view { grid-column:1 / -1; }
    body.locked .numCard b { font-size:min(30vw, 40dvh); }
  }

  /* coins */
  .sc .coins { display:block; font-size:.95rem; font-weight:800; color:#facc15; font-variant-numeric:tabular-nums; }
  /* tighter scores so the timer, the digit boxes and the keypad fit */
  .sc b { font-size:1.8rem; } .sc .wins { display:none; } .sc small { font-size:.75rem; }
  @media (orientation:portrait) {
    #keypad { flex:0 0 clamp(9rem, 28dvh, 22rem); gap:.45rem; }
    #keypad button { font-size:clamp(1.3rem, 3.6dvh, 2rem); }
    .boxes div { height:clamp(2.6rem, 6dvh, 4.2rem); font-size:2rem; }
    .view, .panel { gap:.45rem; }
  }
  /* timer + time bar */
  #hud { display:none; width:100%; flex-direction:column; align-items:center; gap:.4rem; }
  #hud.running { display:flex; }
  #hud .timer { font-size:clamp(1.8rem, 6dvh, 3rem); }
  .fxCoin, .fxDot, .fxPts { position:fixed; z-index:30; pointer-events:none; }
  .fxCoin { border-radius:50%; } .fxDot { width:.7rem; height:.7rem; border-radius:50%; background:#facc15; box-shadow:0 0 .6rem #fde68a; }
  .fxPts { font-size:2.4rem; font-weight:900; color:#fde047; text-shadow:0 2px 10px #000; transform:translate(-50%,-50%); }
  #toast { position:fixed; z-index:12; top:26dvh; left:50%; transform:translateX(-50%); max-width:92vw; padding:.5rem 1rem; border-radius:.8rem; font-weight:800; text-align:center; opacity:0; pointer-events:none; transition:opacity .2s; backdrop-filter:blur(6px); }
  #toast.show { opacity:1; } #toast.good { background:rgba(22,101,52,.85); color:#bbf7d0; } #toast.bad { background:rgba(127,29,29,.85); color:#fecaca; } #toast.info { background:rgba(51,65,85,.88); color:#e2e8f0; }
  #cd { position:fixed; inset:0; background:rgba(8,10,16,.95); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:10; }
  #cd .n { font-size:clamp(7rem, 30dvh, 14rem); font-weight:900; line-height:1; animation:pop .4s ease-out; } #cd .t { font-size:1.5rem; font-weight:700; }
</style>
</head>
<body data-page="join">
<div id="cd" class="hide"><div class="t" id="cdRound"></div><div class="n" id="cdN">3</div><div class="t" data-i18n="startsIn"></div></div>

<div class="app">
  <div class="top">
    <span class="brand">🔒 <span data-i18n="brand"></span> · <span id="gameLbl"></span></span>
    <span class="topBtns"><button id="helpBtn" aria-label="help">?</button><button id="langBtn"></button></span>
  </div>

  <!-- join -->
  <div id="join" class="view">
    <p class="muted" style="margin:0" data-i18n="join.hint"></p>
    <div class="boxes" id="pinBoxes"></div>
    <input id="name" maxlength="20" data-i18n-ph="join.name" autocomplete="off">
    <div id="joinErr" class="err"></div>
    <button class="go" id="joinBtn" data-i18n="join.ready"></button>
    <div class="spacer"></div>
  </div>

  <!-- game -->
  <div id="game" class="view hide">
    <div class="roundPill" id="roundPill"></div>
    <div class="me"><span id="teamTag" class="chip"></span> <span class="muted" id="who"></span> <span id="lives" class="lives"></span></div>
    <div class="scores">
      <div class="sc A" id="scA"><small data-i18n="teamA"></small><b id="sA">0</b><span class="coins" id="cA"></span><span class="wins" id="wA"></span></div>
      <div class="sc B" id="scB"><small data-i18n="teamB"></small><b id="sB">0</b><span class="coins" id="cB"></span><span class="wins" id="wB"></span></div>
    </div>

    <div id="bombInfo" class="mini hide"></div>
    <div id="bombBar"></div>
    <div id="hud"><div class="timer" id="timer">0:00</div><div class="bar"><i id="bar"></i></div></div>

    <div id="waiting" class="panel">
      <div id="result" class="resultCard hide"><div class="rTitle" id="rTitle"></div><div class="rScores"><div class="A"><b id="rA"></b></div><span>–</span><div class="B"><b id="rB"></b></div></div><div class="rVerdict" id="rVerdict"></div></div>
      <p class="big" style="margin:0" id="readyTitle" data-i18n="ready.title"></p>
      <p class="muted" style="margin:0" data-i18n="ready.wait"></p>
      <span id="waitNum" hidden></span><span id="myPinWait" hidden></span>
    </div>

    <div id="running" class="panel hide">
      <div id="live">
        <div class="boxes" id="guessBoxes"></div>
      </div>
      <div id="lockMsg" class="hide">
        <div class="lockHead"><span class="big">🔒 <span id="lockTitle"></span></span><span class="lockSec" id="lockLeft"></span></div>
        <div class="bar"><i id="lockBar"></i></div>
        <div class="lockWhy" id="lockWhy"></div>
        <div class="livesLine" id="livesLine"></div>
        <div class="numCard" id="numCard"><b id="myPinLock"></b></div>
        <div class="numCard hide" id="outCard"><small id="outHint"></small><b>💀</b></div>
      </div>
      <div id="log"></div>
    </div>

    <span id="myPin" hidden></span><span id="miniNum" hidden></span>
  </div>

  <div id="keypad"></div>
</div>

<div id="help"><div class="box"><h2 data-i18n="helpTitle"></h2><div id="helpBody"></div><button id="helpClose" data-i18n="helpClose"></button></div></div>
<div id="toast"></div>
<div id="boom">💥</div>
<div id="over"><div class="ovTime" id="ovTime"></div><div class="ovSkull" id="ovSkull"></div><div class="ovText" id="ovText"></div><div class="ovHint" id="ovHint"></div></div>

<script src="/socket.io/socket.io.js"></script>
<script src="/i18n.js"></script>
<script src="/coin.js"></script>
<script src="/spritefx.js"></script>
<script src="/live.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const GAME = +((location.pathname.match(/\/g\/(\d+)\//) || [])[1] || 1);
const LBKEY = 'lb' + GAME + (new URLSearchParams(location.search).get('sim') || ''); // a device can be in a different game per game number (the simulator gives every phone frame its own key)
const socket = io('/g' + GAME, { reconnectionDelayMax: 2000 });
let wasOut = false;
let team = null, state = null, offset = 0, mode = 'join', lastScores = null, wasLocked = false, overFx = false, lastLockLeft = 0;
const bufs = { join: '', game: '' };
const esc = (x) => String(x).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const logItems = [];   // newest first: the results of what the player did (and being locked)
const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
                set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} } };
const buzz = (p) => { try { navigator.vibrate && navigator.vibrate(p); } catch {} };
// synthesized sfx (no audio files); the context is unlocked by the first tap
let actx = null;
const unlockAudio = () => { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch {} };
document.addEventListener('pointerdown', unlockAudio);
function beep(notes) { // notes: [freq, startSec, durSec]
  try {
    if (!actx || actx.state !== 'running') return;
    const t0 = actx.currentTime;
    for (const [f, at, d] of notes) {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'square'; o.frequency.setValueAtTime(f, t0 + at);
      g.gain.setValueAtTime(0.0001, t0 + at);
      g.gain.exponentialRampToValueAtTime(0.15, t0 + at + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + at + d);
      o.connect(g); g.connect(actx.destination); o.start(t0 + at); o.stop(t0 + at + d + 0.02);
    }
  } catch {}
}
const sfxLock = () => beep([[440, 0, 0.18], [330, 0.18, 0.18], [220, 0.36, 0.3]]);
const sfxRelease = () => beep([[523, 0, 0.12], [659, 0.12, 0.12], [784, 0.24, 0.25]]);

// ----- on-screen keypad (also mirrors a physical keyboard) -----
const kp = $('keypad');
['1','2','3','4','5','6','7','8','9','', '0','⌫'].forEach((k) => {
  const b = document.createElement('button');
  if (k === '') { b.style.visibility = 'hidden'; b.tabIndex = -1; }
  else { b.textContent = k; if (k === '⌫') b.className = 'del'; b.onclick = () => press(k); }
  kp.appendChild(b);
});
function drawBoxes() {
  const id = mode === 'join' ? 'pinBoxes' : 'guessBoxes';
  const v = bufs[mode];
  $(id).innerHTML = [0,1,2,3].map((i) => `<div class="${i === v.length ? 'cur' : ''}${i === v.length - 1 ? ' filled' : ''}">${v[i] ?? ''}</div>`).join('');
}
function canType() {
  if (mode === 'join') return true;
  return state && state.phase === 'running' && state.me.lockedUntil <= Date.now() + offset;
}
function press(k) {
  if (!canType()) return;
  if (k === '⌫') bufs[mode] = bufs[mode].slice(0, -1);
  else if (bufs[mode].length < 4) bufs[mode] += k;
  drawBoxes();
  if (mode === 'game' && bufs.game.length === 4) submitGuess();
}
document.addEventListener('keydown', (e) => {
  if (e.target === $('name')) { if (e.key === 'Enter') $('name').blur(); return; }
  if (/^\d$/.test(e.key)) press(e.key);
  else if (e.key === 'Backspace') press('⌫');
  else if (e.key === 'Enter' && mode === 'join') $('joinBtn').click();
});

// ----- join -----
function setTeamClass(tm) { document.body.classList.remove('tA', 'tB'); if (tm) document.body.classList.add('t' + tm); }
let joinErrKey = null;
function setJoinErr(key, params) { joinErrKey = key ? { key, params } : null; renderJoinErr(); }
function renderJoinErr() { $('joinErr').textContent = joinErrKey ? t(joinErrKey.key, joinErrKey.params) : ''; }

function showGame() { mode = 'game'; keepAwake(); $('join').classList.add('hide'); $('game').classList.remove('hide'); drawBoxes(); }
function showJoin() { mode = 'join'; $('game').classList.add('hide'); $('join').classList.remove('hide'); document.body.classList.remove('locked'); setTeamClass(team); drawBoxes(); }

function doJoin(pin, name, silent, attempt = 0) {
  socket.emit('join', { pin, name }, (res) => {
    if (res.error) {
      // after a refresh the server may still see the old connection for a moment: retry before giving up
      if (silent && res.error === 'pinUsed' && attempt < 10) return setTimeout(() => doJoin(pin, name, true, attempt + 1), 1000);
      if (silent) store.set(LBKEY, null);
      else { setJoinErr(res.error); buzz(80); }
      return;
    }
    team = res.team;
    store.set(LBKEY, JSON.stringify({ pin, name }));
    setTeamClass(team);
    showGame();
  });
}
$('joinBtn').onclick = () => {
  setJoinErr(null);
  doJoin(bufs.join, $('name').value, false);
};
socket.on('connect', () => {
  const saved = store.get(LBKEY);
  if (saved) { const s = JSON.parse(saved); doJoin(s.pin, s.name, true); }
});
socket.on('kicked', (key) => {
  store.set(LBKEY, null); bufs.game = ''; bufs.join = ''; team = null;
  showJoin(); setJoinErr(key);
});

// ----- game -----
function submitGuess() {
  const number = bufs.game;
  bufs.game = ''; drawBoxes();
  socket.emit('guess', { number }, (r) => setFb(r));
}
function setFb(r) {
  if (r.kind === 'bad') { const b = $('guessBoxes'); b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); buzz(120); }
  if (r.kind === 'good') buzz(40);
  if (r.code === 'coinGot') { const b = $('guessBoxes').getBoundingClientRect(), z = 96; collectFx({ left: b.left + b.width / 2 - z / 2, top: b.top + b.height / 2 - z / 2, width: z, height: z }, r.p.tier, r.p.pts); }
  addLog(r);
}
function addLog(r) { logItems.unshift(r); logItems.length = Math.min(logItems.length, 30); renderFb(); }
function logText(r) {
  const key = r.code === 'locked' ? 'locked.msg' : r.code;
  const p = r.p ? { ...r.p } : null;
  if (p) {
    if (p.tier) p.tier = t('coin_' + p.tier);
    if (p.i !== undefined) p.bomb = t('bomb_' + p.i);
    if (p.pin) p.name = playerName(p.name, p.pin);
  }
  return t(key, p);
}
function renderFb() {
  const el = $('log');
  el.innerHTML = logItems.map((r) => `<div class="${r.kind}">${esc(logText(r))}</div>`).join('');
  // hide the lines that do not fully fit in the free space
  const lim = el.getBoundingClientRect().bottom;
  for (const d of el.children) if (d.getBoundingClientRect().bottom > lim + 1) d.style.visibility = 'hidden';
}
window.addEventListener('resize', () => renderFb());

function roundText(s) {
  if (s.phase !== 'lobby') return t('round', { n: s.round });
  return s.round ? t('roundDone', { n: s.round }) + ' · ' + t('upNext', { n: s.round + 1 }) : t('upNext', { n: 1 });
}

function render() {
  if (!state) return;
  const s = state, tm = s.me.team;
  setTeamClass(tm);
  $('roundPill').textContent = roundText(s);
  $('teamTag').textContent = teamName(tm); $('teamTag').className = 'chip ' + tm;
  $('who').textContent = s.me.name ? s.me.name + ' · ' + s.me.pin : playerName(s.me.name, s.me.pin); // the number stays small up here; it only goes big when you are locked
  $('lives').textContent = s.me.left === null ? '' : '❤️ ' + s.me.left; // no counter when returns are unlimited
  $('myPin').textContent = s.me.pin; $('myPinWait').textContent = s.me.pin; $('myPinLock').textContent = s.me.pin;
  $('sA').textContent = s.scores.A; $('sB').textContent = s.scores.B;
  $('cA').textContent = '🪙 ' + s.coins.A; $('cB').textContent = '🪙 ' + s.coins.B;
  $('wA').textContent = '🏆 ' + s.wins.A + ' ' + t('winsWord'); $('wB').textContent = '🏆 ' + s.wins.B + ' ' + t('winsWord');
  const lr = s.phase === 'lobby' ? s.lastResult : null;   // result of the round that just ended
  $('result').classList.toggle('hide', !lr);
  $('readyTitle').classList.toggle('hide', !!lr);
  $('waitNum').classList.toggle('hide', !!lr);
  if (lr) {
    $('rTitle').textContent = t('resultTitle', { n: lr.round });
    $('rA').textContent = lr.scores.A; $('rB').textContent = lr.scores.B;
    const won = lr.winner === tm, draw = !lr.winner;
    $('result').className = 'resultCard ' + (draw ? '' : won ? 'won' : 'lost');
    $('rVerdict').textContent = draw ? t('youDraw') : won ? t('youWon') : t('youLost');
  }
  $('scA').classList.toggle('mine', tm === 'A'); $('scB').classList.toggle('mine', tm === 'B');
  document.querySelectorAll('.sc .you').forEach((e) => e.remove());
  $(tm === 'A' ? 'scA' : 'scB').insertAdjacentHTML('afterbegin', `<span class="you">${t('you')}</span>`);
  if (lastScores) for (const k of ['A', 'B']) if (lastScores[k] !== s.scores[k]) {
    const el = $('sc' + k); el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
  }
  lastScores = { ...s.scores };

  const running = s.phase === 'running';
  $('waiting').classList.toggle('hide', running || s.phase === 'countdown');
  $('running').classList.toggle('hide', !running);
  $('miniNum').classList.toggle('hide', !(running || lr)); // the waiting card shows the number unless a result is up
  if (!running) { document.body.classList.remove('locked'); logItems.length = 0; renderFb(); bufs.game = ''; drawBoxes(); }
  tick();
}
socket.on('state', (s) => { state = s; offset = s.now - Date.now(); render(); });

function fmtSec(sec) { return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); }
function renderBombs() {
  const s = state, bar = $('bombBar'), info = $('bombInfo');
  if (!s || !s.me) return;
  const me = s.me.team, other = me === 'A' ? 'B' : 'A', now = Date.now() + offset;
  const list = s.bombs || [], mini = list.length > 2;
  bar.classList.toggle('mini', mini);
  bar.innerHTML = s.phase !== 'running' ? '' : list.map((b) => {
    const left = fmtSec(Math.max(0, Math.ceil((b.endsAt - now) / 1000))), bomb = t('bomb_' + b.i);
    if (mini) return b.by === me
      ? `<div class="bTile ours">${bombImg(b.i)}<span>${esc(t('bombMiniOurs'))}<br>${left}</span></div>`
      : `<div class="bTile alarm">${bombImg(b.i)}<span>${esc(t('bombMiniThem', { n: b.got, need: b.need }))}<br>${left}</span></div>`;
    return b.by === me
      ? `<div class="bRow ours">${bombImg(b.i)}<span><b class="tag">${esc(t('bombTagOurs', { bomb }))}</b><br>${esc(t('bombOursTxt'))} ${left}</span></div>`
      : `<div class="bRow alarm">${bombImg(b.i)}<span><b class="tag">${esc(t('bombTagThem', { bomb }))}</b><br>${esc(t('bombDefuseTxt', { bomb, n: b.got, need: b.need }))} · ${left}</span></div>`;
  }).join('');
  info.classList.toggle('hide', s.phase !== 'running' || !s.bombsEnabled);
  if (s.bombInfo) info.textContent = t('bombInfo', { cost: s.bombInfo.cost[me], need: s.bombInfo.need[other] });
}
function boomFlash() { const e = $('boom'); e.classList.remove('fx'); void e.offsetWidth; e.classList.add('fx'); }
socket.on('bomb', (e) => {
  if (!team) return;
  const mine = e.by === team;
  if (e.type === 'armed' && !mine) {
    addLog({ kind: 'bad', code: 'bombAlarm', p: { i: e.i } });
    buzz([150, 80, 150, 80, 300]); beep([[880, 0, .15], [660, .2, .15], [880, .4, .15], [660, .6, .15]]);
  } else if (e.type === 'boom') {
    addLog(mine ? { kind: 'good', code: 'bombBoomUs', p: { i: e.i, n: e.n, of: e.of } } : { kind: 'bad', code: 'bombBoom', p: { i: e.i, n: e.n, of: e.of } });
    boomFlash(); buzz([100, 40, 300]); beep([[110, 0, .5], [70, .1, .6]]);
  } else if (e.type === 'defused') {
    if (mine) addLog({ kind: 'bad', code: 'bombFailed', p: { i: e.i } });
    else if (!(logItems[0] && logItems[0].code === 'bombDefused')) addLog({ kind: 'good', code: 'bombDefused', p: { i: e.i, pts: e.pts } });
  }
  renderBombs();
});

function tick() {
  if (!state) return;
  renderBombs();
  const now = Date.now() + offset;
  const cd = state.phase === 'countdown';
  $('cd').classList.toggle('hide', !cd);
  if (cd) {
    $('cdRound').textContent = t('round', { n: state.round });
    const n = Math.max(1, Math.ceil((state.startsAt - now) / 1000));
    if ($('cdN').textContent != n) { $('cdN').textContent = n; const e = $('cdN'); e.style.animation = 'none'; void e.offsetWidth; e.style.animation = ''; }
    bufs.game = ''; drawBoxes();
  }
  $('hud').classList.toggle('running', state.phase === 'running');
  const over = state.phase === 'running' && !!state.me.out;   // no returns left: game over until the round ends
  $('over').classList.toggle('show', over);
  if (over && !overFx) { overFx = true; fxPlay($('ovSkull'), 'out', { ms: 500 }); } else if (!over) overFx = false;
  if (over) {
    const sec = Math.max(0, Math.ceil((state.endsAt - (Date.now() + offset)) / 1000));
    $('ovTime').textContent = Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
    $('ovTime').classList.toggle('low', sec <= 10);
    $('ovText').textContent = t('gameOver'); $('ovHint').textContent = t('outHint');
  }
  if (state.phase === 'running') {
    const left = Math.max(0, state.endsAt - now);
    const sec = Math.ceil(left / 1000);
    $('timer').textContent = Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
    $('timer').classList.toggle('low', sec <= 10);
    $('bar').style.width = (state.duration ? Math.min(100, left / state.duration * 100) : 100) + '%';
    const lockLeft = state.me.lockedUntil - now;
    const locked = lockLeft > 0;
    const gone = locked && !!state.me.out;   // out of the round: the game-over layer is shown instead of the red lock screen
    document.body.classList.toggle('locked', locked && !gone);
    $('lockMsg').classList.toggle('hide', !locked || gone);
    $('live').classList.toggle('hide', locked && !gone);
    if (locked) {
      const out = !!state.me.out;
      $('lockTitle').textContent = t(out ? 'outTitle' : 'lockedTitle');
      $('lockLeft').textContent = out ? '' : Math.ceil(lockLeft / 1000) + t('sec');
      $('lockBar').style.width = out ? '0' : Math.min(100, lockLeft / (state.lockMs || 10000) * 100) + '%';
      $('livesLine').textContent = out || state.me.left === null ? '' : (state.me.left <= 8 ? '❤️'.repeat(state.me.left) : '❤️×' + state.me.left) + '💔  ' + t('livesLeft', { n: state.me.left });
      $('numCard').classList.toggle('hide', out); $('outCard').classList.toggle('hide', !out);
      $('outHint').textContent = t('outHint');
      bufs.game = '';
      wasOut = out;
      const bombed = state.me.lockCause === 'bomb';
      $('lockWhy').textContent = t(out ? 'lockWhyOut' : 'lockKilled');   // the one message shown while locked
      lastLockLeft = lockLeft;
      if (!wasLocked) { buzz([200, 80, 200]); sfxLock(); addLog({ kind: 'bad', code: out ? 'youOut' : bombed ? 'youBombed' : 'youLocked' }); fxBurst(out ? 'out' : 'lock', { bottom: !out }); }
    }
    if (wasLocked && !locked) {
      const early = lastLockLeft > 1200 && !wasOut;   // freed with time left on the clock = a teammate typed our number
      buzz(60); sfxRelease();
      addLog({ kind: 'good', code: wasOut ? 'youBack' : early ? 'youRevivedMate' : 'youRevivedTimer' });
      wasOut = false;
    }
    wasLocked = locked;
    $('miniNum').classList.toggle('hide', locked); // the lock card already shows the number
    kp.classList.toggle('off', locked);
  } else { kp.classList.remove('off'); wasLocked = false; }
}
setInterval(tick, 200);

// ----- resync after background / sleep / lost connection -----
keepAlive(socket, (res) => {
  if (res.notJoined) {
    const saved = store.get(LBKEY);
    if (saved) { const s = JSON.parse(saved); doJoin(s.pin, s.name, true); }
  } else if (res.state) { state = res.state; offset = state.now - Date.now(); render(); }
});


// ----- coins: a coin has its own 4-digit number, typed on the keypad exactly like a player's number -----
// collect effect: the coin pops, flies into the team's score card, sparks fly out and "+N" floats up
function collectFx(rect, tier, pts) {
  const cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
  const add = (cls, css) => { const d = document.createElement('div'); d.className = cls; Object.assign(d.style, css); document.body.appendChild(d); return d; };
  const target = $('sc' + state.me.team).getBoundingClientRect();
  const dx = target.left + target.width / 2 - cx, dy = target.top + target.height / 2 - cy;
  const c = add('fxCoin', { left: rect.left + 'px', top: rect.top + 'px', width: rect.width + 'px', height: rect.height + 'px', background: `url(/coins/${tier}.png) center/cover` });
  c.animate([{ transform: 'scale(1)', opacity: 1 }, { transform: 'translateY(-1.5rem) scale(1.3)', opacity: 1, offset: .25 }, { transform: `translate(${dx}px, ${dy}px) scale(.2)`, opacity: .3 }],
    { duration: 800, easing: 'cubic-bezier(.45,0,.75,.4)' }).onfinish = () => c.remove();
  for (let k = 0; k < 12; k++) {
    const a = (k / 12) * Math.PI * 2 + Math.random() * .4, d = rect.width * (.6 + Math.random() * .5);
    const dot = add('fxDot', { left: cx - 5 + 'px', top: cy - 5 + 'px' });
    dot.animate([{ transform: 'translate(0,0) scale(1)', opacity: 1 }, { transform: `translate(${Math.cos(a) * d}px, ${Math.sin(a) * d}px) scale(.2)`, opacity: 0 }],
      { duration: 550, easing: 'ease-out' }).onfinish = () => dot.remove();
  }
  const p = add('fxPts', { left: cx + 'px', top: cy + 'px' }); p.textContent = '+' + pts;
  p.animate([{ transform: 'translate(-50%,-50%) scale(.6)', opacity: 0 }, { transform: 'translate(-50%,-110%) scale(1.2)', opacity: 1, offset: .3 }, { transform: 'translate(-50%,-260%) scale(1)', opacity: 0 }],
    { duration: 1000, easing: 'ease-out' }).onfinish = () => p.remove();
  buzz([30, 40, 60]); beep([[784, 0, .08], [1047, .08, .1], [1319, .18, .22]]);
}

// keep the screen awake during a game where the browser allows it (needs https or localhost)
let wakeLock = null;
async function keepAwake() {
  try { if (navigator.wakeLock && mode === 'game' && !document.hidden && !wakeLock) {
    wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => (wakeLock = null)); } } catch {}
}
document.addEventListener('visibilitychange', keepAwake);

// help: the player instructions in a pop-up
const helpPics = {
  4: () => `<div class="pics">${[['gold', 5], ['silver', 3], ['bronze', 1]].map(([k, pts]) => `<figure>${coinImg(k)}<figcaption>${esc(t('coin_' + k))}<br>+${pts}</figcaption></figure>`).join('')}</div>`,
  6: () => `<div class="pics">${[0, 1, 2, 3].map((i) => `<figure>${bombImg(i)}<figcaption>${esc(t('bomb_' + i))}</figcaption></figure>`).join('')}</div>`,
  9: () => `<div class="pics"><figure>${fxStill('lock')}<figcaption>${esc(t('helpCapKill'))}</figcaption></figure></div>`,
  11: () => `<div class="pics"><figure>${fxStill('out')}<figcaption>${esc(t('helpCapOut'))}</figcaption></figure></div>`,
  12: () => `<div class="pics wide">${[['#22c55e', 'bombTagOurs'], ['#ef4444', 'bombTagThem']].map(([c, k]) => `<figure><span class="plate" style="--ring:${c}">${bombImg(0)}</span><figcaption>${esc(t(k, { bomb: t('bomb_0') }))}</figcaption></figure>`).join('')}</div>`,
};
// the help only explains what is switched on in this game: no bomb lines when bombs are off, no hearts when returns are unlimited
const helpItems = () => [1, 2, 3, 9, 10, ...(state && state.unlimitedReturns ? [] : [11]), 4, ...(state && state.bombsEnabled === false ? [] : [5, 6, 7, 12]), 8];
const renderHelp = () => { $('helpBody').innerHTML = helpItems().map((n) => `<p>${esc(t(n === 3 && state && state.unlimitedReturns ? 'help3u' : 'help' + n, { s: state && state.bombMs ? state.bombMs / 1000 : 25 }))}</p>` + (helpPics[n] ? helpPics[n]() : '')).join(''); };
$('helpBtn').onclick = () => { renderHelp(); $('help').classList.add('show'); };
$('helpClose').onclick = () => $('help').classList.remove('show');
$('help').addEventListener('pointerdown', (e) => { if (e.target === $('help')) $('help').classList.remove('show'); });

const setGameLbl = () => ($('gameLbl').textContent = t('game', { n: GAME }));
setGameLbl();
window.onLangChange = () => { renderHelp(); setGameLbl(); renderJoinErr(); renderFb(); render(); };
drawBoxes();
</script>
</body>
