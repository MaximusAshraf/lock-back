<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lock Back – Test board</title>
<style>
  :root { --a:#3b82f6; --b:#f59e0b; --bg:#0b0f17; --card:#161d2b; --line:#27324a; --text:#eef2f8; --muted:#8b97ab; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:radial-gradient(120% 60% at 50% 0%, #17203a 0%, var(--bg) 70%); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; padding:1.2vh 1.2vw; display:flex; flex-direction:column; gap:1.2vh; overflow:hidden; }
  header { display:flex; align-items:center; justify-content:space-between; gap:10px; flex:none; }
  h1 { margin:0; font-size:clamp(1.1rem, 3vh, 2rem); } .hint { color:var(--muted); font-size:clamp(.75rem, 1.7vh, 1rem); margin-inline-start:1em; font-weight:500; }
  nav { display:flex; gap:8px; } nav button, nav a button { padding:6px 12px; border:0; border-radius:10px; background:#34405a; color:var(--text); font-weight:700; cursor:pointer; opacity:.6; } nav button:hover { opacity:1; }
  /* the two teams fill all the free space; fit() picks the grid that makes the numbers as big as possible */
  .teams { flex:1; min-height:0; display:grid; grid-template-columns:1fr 1fr; gap:1.2vw; }
  .team { background:var(--card); border-radius:1.6vh; border-top:1vh solid var(--c); padding:1vh 1vw 1.2vh; display:flex; flex-direction:column; gap:1vh; min-height:0; } .team.A { --c:var(--a); } .team.B { --c:var(--b); }
  .team h3 { margin:0; display:flex; justify-content:space-between; align-items:baseline; font-size:clamp(1rem, 3vh, 2rem); flex:none; } .team h3 small { color:var(--muted); font-weight:700; }
  .nums { flex:1; min-height:0; display:grid; gap:.8vh .6vw; }
  .n { background:color-mix(in srgb, var(--c) 20%, #0e1420); border:2px solid var(--c); border-radius:1.2vh; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; user-select:none; min-width:0; min-height:0; overflow:hidden; }
  .n b { font:900 var(--fs, 2rem)/1 ui-monospace,Menlo,Consolas,monospace; letter-spacing:.04em; }
  .n small { margin-top:.15em; font-size:calc(var(--fs, 2rem) * .3); font-weight:700; max-width:94%; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; color:var(--text); opacity:.85; }
  .n:hover { background:color-mix(in srgb, var(--c) 40%, #0e1420); }
  .n.locked { background:#5b1a1a; border-color:#ef4444; } .n.locked b { color:#fecaca; }
  .empty { margin:auto; color:var(--muted); font-size:clamp(1rem, 3vh, 2rem); }
  /* coins and bombs: one row along the bottom */
  .strip { flex:none; display:flex; gap:.5vw; align-items:stretch; }
  /* compact: 2 rows (coins) and a 2 x 2 block (bombs); each card is a small picture next to a BIG code with its name under it */
  .strip .grp { display:grid; grid-auto-flow:column; grid-template-rows:repeat(2, auto); grid-auto-columns:minmax(0, 1fr); gap:.4vh .3vw; background:var(--card); border-radius:1.4vh; padding:.5vh .4vw; flex:3; }
  .strip .grp.bombs { flex:1; grid-auto-flow:row; grid-template-columns:repeat(2, minmax(0, 1fr)); grid-auto-columns:auto; }
  .it { min-width:0; cursor:pointer; border-radius:1vh; padding:.2vh .3vw; display:grid; grid-template-columns:auto minmax(0, 1fr); grid-template-rows:auto auto; column-gap:.4vw; align-items:center; text-align:start; }
  .it:hover { background:#222d47; }
  .it img { grid-row:1 / span 2; height:clamp(22px, min(5.5vh, 3.4vw), 60px); width:auto; object-fit:contain; display:block; }
  .it b { display:block; font:900 clamp(1.1rem, min(4.8vh, 2.7vw), 3.4rem)/1.05 ui-monospace,Menlo,monospace; letter-spacing:.02em; overflow:hidden; }
  .it small { display:block; color:var(--muted); font-size:clamp(.6rem, 1.5vh, .95rem); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  /* a coin was taken / a bomb is armed: the card lights up with the team's colour */
  .it { position:relative; }
  .it.hitA, .it.hitB { animation:hit 1.8s ease-out; } .it.hitA { --h:var(--a); } .it.hitB { --h:var(--b); }
  @keyframes hit { 0% { background:var(--h); transform:scale(1.18); box-shadow:0 0 3vh var(--h); } 100% { background:transparent; transform:scale(1); box-shadow:none; } }
  /* the message takes the place of the name under the code, so it never covers the code */
  .it .tag { grid-column:2; grid-row:2; justify-self:start; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding:0 .5em; border-radius:99px; background:var(--h, #ef4444); color:#fff; font-weight:900; font-size:clamp(.6rem, 1.5vh, .95rem); display:none; }
  .it.hitA .tag, .it.hitB .tag, .it.armed .tag { display:block; }
  .it.hitA small, .it.hitB small, .it.armed small { display:none; }
  .it.armed { outline:3px solid #ef4444; animation:armed .7s infinite alternate; } @keyframes armed { to { background:#7f1d1d; } }
  #toast { position:fixed; bottom:2vh; left:50%; transform:translateX(-50%); background:#16a34a; color:#fff; padding:8px 18px; border-radius:99px; font-weight:800; opacity:0; transition:opacity .2s; pointer-events:none; }
  #toast.show { opacity:1; }
  @media (max-aspect-ratio: 1/1) { .teams { grid-template-columns:1fr; } body { overflow:auto; } .teams { min-height:70vh; } }
</style>
</head>
<body data-page="testboard">
<header>
  <h1>🧪 <span data-i18n="testBoard"></span> · <span id="gameLbl"></span><span class="hint" data-i18n="testBoardHint"></span></h1>
  <nav><a href="admin"><button data-i18n="backAdmin"></button></a><button id="langBtn"></button></nav>
</header>
<div class="teams" id="teams"></div>
<div class="strip"><div class="grp" id="coins"></div><div class="grp bombs" id="bombs"></div></div>

<div id="toast"></div>
<script src="/socket.io/socket.io.js"></script>
<script src="/i18n.js"></script>
<script src="/live.js"></script>
<script src="/coin.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const GAME = +((location.pathname.match(/\/g\/(\d+)\//) || [])[1] || 1);
const socket = io('/g' + GAME, { reconnectionDelayMax: 2000 });
let state = null, items = [], offset = 0;
$('gameLbl').textContent = t('game', { n: GAME });

let toastTimer = null;
function copy(code) {
  try { navigator.clipboard.writeText(code); } catch {}
  const el = $('toast'); el.textContent = t('copied', { code }); el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 1200);
}
document.addEventListener('click', (e) => { const c = e.target.closest('[data-code]'); if (c) copy(c.dataset.code); });

function render(s) {
  if (s) { state = s; offset = s.now - Date.now(); }
  s = state; if (!s) return;
  // only the players that joined (a number is shown once someone took it)
  $('teams').innerHTML = ['A', 'B'].map((tm) => {
    const list = [...s.teams[tm].players].sort((x, y) => String(x.pin).localeCompare(String(y.pin)));
    return `<div class="team ${tm}"><h3><span>${esc(teamName(tm))}</span><small>${list.length}</small></h3>
      <div class="nums" id="nums${tm}">${list.length ? list.map((p) => `<div class="n ${p.lockedUntil > s.now ? 'locked' : ''}" data-code="${p.pin}"><b>${p.pin}</b><small>${p.bot ? '🤖 ' : ''}${esc(playerName(p.name, p.pin))}</small></div>`).join('') : `<div class="empty">${esc(t('noPlayers'))}</div>`}</div></div>`;
  }).join('');
  fit();
}
// choose the number of columns that makes the cards (and so the numbers) as large as the free space allows
function fit() {
  for (const tm of ['A', 'B']) {
    const box = $('nums' + tm); if (!box) continue;
    const n = box.querySelectorAll('.n').length; if (!n) continue;
    const W = box.clientWidth, H = box.clientHeight, gap = 8;
    let best = { fs: 0, cols: 1 };
    for (let cols = 1; cols <= n; cols++) {
      const rows = Math.ceil(n / cols), cw = (W - gap * (cols - 1)) / cols, ch = (H - gap * (rows - 1)) / rows;
      const fs = Math.min(cw / 2.9, ch / 1.9);   // a number is about 2.5 characters wide and the name sits under it
      if (fs > best.fs) best = { fs, cols };
    }
    box.style.gridTemplateColumns = `repeat(${best.cols}, 1fr)`;
    box.style.gridAutoRows = '1fr';
    box.style.setProperty('--fs', Math.max(14, Math.floor(best.fs)) + 'px');
  }
}
window.addEventListener('resize', fit);
function drawItems() {
  const TN = { gold: 'coin_gold', silver: 'coin_silver', bronze: 'coin_bronze' };
  $('coins').innerHTML = items.filter((c) => c.bomb === undefined).map((c) => `<div class="it" data-code="${c.code}"><span class="tag"></span><img src="/print/${c.tier}.png" alt=""><b>${c.code}</b><small>${esc(t(TN[c.tier]))} +${c.points}</small></div>`).join('');
  $('bombs').innerHTML = items.filter((c) => c.bomb !== undefined).map((c) => `<div class="it" data-code="${c.code}" data-bomb="${c.bomb}"><span class="tag"></span><img src="/print/${BOMB_SHAPES[c.bomb]}.png" alt=""><b>${c.code}</b><small>${esc(t('bomb_' + c.bomb))}</small></div>`).join('');
}
// light up a coin when a team takes it, and keep a bomb lit (with its countdown) while it is armed
function flash(el, tm, text) {
  if (!el) return;
  el.classList.remove('hitA', 'hitB'); void el.offsetWidth; el.classList.add('hit' + tm);
  el.querySelector('.tag').textContent = text;
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('hitA', 'hitB'), 1800);
}
socket.on('coinTaken', (e) => flash(document.querySelector(`.it[data-code="${e.code}"]`), e.team, e.team + ' +' + e.pts));
socket.on('bomb', (e) => {
  const el = document.querySelector(`.it[data-bomb="${e.i}"]`);
  if (e.type !== 'armed') flash(el, e.target, e.type === 'defused' ? '✅' : '💥');
});
function tickBombs() {
  if (!state) return;
  const now = Date.now() + offset;
  document.querySelectorAll('.it[data-bomb]').forEach((el) => {
    const b = (state.bombs || []).find((x) => String(x.i) === el.dataset.bomb);
    el.classList.toggle('armed', !!b);
    if (b) { const sec = Math.max(0, Math.ceil((b.endsAt - now) / 1000)); el.querySelector('.tag').textContent = b.by + '→' + b.target + ' ' + Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); }
  });
}
setInterval(tickBombs, 300);
fetch('/api/coins').then((r) => r.json()).then((c) => { items = c; drawItems(); });
socket.on('connect', () => socket.emit('admin:hello', null, (s) => render(s)));
socket.on('state', render);
keepAlive(socket, (res) => (res.state ? render(res.state) : socket.emit('admin:hello', null, (s) => render(s))));
window.onLangChange = () => { render(); drawItems(); $('gameLbl').textContent = t('game', { n: GAME }); };
</script>
</body>
</html>
