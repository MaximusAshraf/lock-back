<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lock Back – Simulator</title>
<style>
  :root { --a:#3b82f6; --b:#f59e0b; --bg:#0b0f17; --card:#161d2b; --line:#27324a; --text:#eef2f8; --muted:#8b97ab; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; display:flex; flex-direction:column; gap:.6rem; padding:.6rem .8rem; overflow:hidden; }
  header { display:flex; align-items:center; justify-content:space-between; gap:.6rem; flex:none; flex-wrap:wrap; }
  h1 { margin:0; font-size:1.2rem; }
  .info { display:flex; align-items:center; gap:1rem; font-weight:800; font-variant-numeric:tabular-nums; }
  .sc { padding:.15rem .8rem; border-radius:99px; font-size:1.1rem; } .sc.A { background:var(--a); } .sc.B { background:var(--b); color:#1c1200; }
  nav { display:flex; gap:.5rem; align-items:center; }
  .bar { display:flex; gap:.6rem; align-items:center; flex-wrap:wrap; flex:none; background:var(--card); border:1px solid var(--line); border-radius:.8rem; padding:.4rem .7rem; font-size:.9rem; }
  .bar label { display:flex; align-items:center; gap:.3rem; color:var(--muted); font-weight:600; }
  button, select, input { font:inherit; }
  button { padding:.4rem .8rem; border:0; border-radius:.6rem; background:#34405a; color:var(--text); font-weight:700; cursor:pointer; }
  button.go { background:linear-gradient(160deg,#34d399,#16a34a); color:#03200f; } button.stop { background:#b91c1c; }
  select, input { background:#0e1420; color:var(--text); border:1px solid var(--line); border-radius:.5rem; padding:.3rem .4rem; } input[type=number] { width:4.2rem; }
  #rows { flex:1; min-height:0; display:flex; flex-direction:column; gap:.5rem; } #rows.side { flex-direction:row; }
  .row { flex:1; min-width:0; min-height:0; display:flex; align-items:center; gap:.7rem; border-top:.35rem solid var(--c); background:var(--card); border-radius:.8rem; padding:.3rem .7rem; } .row.A { --c:var(--a); } .row.B { --c:var(--b); }
  .row h2 { margin:0; writing-mode:vertical-rl; transform:rotate(180deg); font-size:1rem; color:var(--c); white-space:nowrap; }
  .phones { flex:1; display:grid; gap:12px; justify-content:center; align-content:center; height:100%; min-width:0; }
  .phone { position:relative; flex:none; border:.25rem solid #000; border-radius:1.2rem; overflow:hidden; background:#000; box-shadow:0 0 0 .12rem var(--c); }
  .phone iframe { position:absolute; left:0; top:0; width:375px; height:812px; border:0; transform-origin:0 0; background:var(--bg); }
  .phone .tag { position:absolute; left:.3rem; bottom:.3rem; z-index:2; background:rgba(0,0,0,.65); border-radius:99px; padding:.05rem .5rem; font-size:.75rem; font-weight:800; pointer-events:none; }
</style>
</head>
<body data-page="simulator">
<header>
  <h1>🎮 <span data-i18n="simBtn"></span> · <span id="gameLbl"></span></h1>
  <div class="info"><span class="sc A" id="scA">0</span><span id="status">—</span><span class="sc B" id="scB">0</span></div>
  <nav><a href="admin"><button data-i18n="backAdmin"></button></a><button id="langBtn"></button></nav>
</header>
<div class="bar">
  <button class="go" id="startBtn" data-i18n="simStart"></button>
  <label><input type="number" id="mins" value="2" min="0.1" max="60" step="0.5"><span data-i18n="simMin"></span></label>
  <button class="stop" id="endBtn" data-i18n="simEnd"></button>
  <label><input type="checkbox" id="auto" checked><span data-i18n="simAuto"></span></label>
  <label><input type="checkbox" id="pilot" checked><span data-i18n="simPilot"></span></label>
  <label><span data-i18n="simSpeed"></span><select id="speed"><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select></label>
  <label><span data-i18n="simPhones"></span><select id="count"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option></select></label>
  <button id="botsBtn" data-i18n="simBots"></button>
  <button id="clearBtn" data-i18n="simClear"></button>
</div>
<div id="rows"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="/i18n.js"></script>
<script src="/live.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const GAME = +((location.pathname.match(/\/g\/(\d+)\//) || [])[1] || 1);
const socket = io('/g' + GAME, { reconnectionDelayMax: 2000 });
let state = null, offset = 0, items = [], phones = [], prevPhase = null, built = '';
$('gameLbl').textContent = t('game', { n: GAME });
const pick = (list) => list[Math.floor(Math.random() * list.length)];
const fmt = (sec) => Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');

// ---------- header ----------
function renderHead() {
  const s = state; if (!s) return;
  $('scA').textContent = s.teams.A.score; $('scB').textContent = s.teams.B.score;
  const now = Date.now() + offset;
  $('status').textContent = s.phase === 'running' ? t('round', { n: s.round }) + ' · ' + fmt(Math.max(0, Math.ceil((s.endsAt - now) / 1000)))
    : s.phase === 'countdown' ? t('startsInShort', { n: s.round, s: Math.max(0, Math.ceil((s.startsAt - now) / 1000)) }) : s.round ? t('roundDone', { n: s.round }) : t('scrWaiting');
}
setInterval(renderHead, 500);

// ---------- phone frames: the real player page, one iframe per phone, each with its own saved login ----------
// The two teams go side by side or one above the other, whichever makes the phones bigger; inside a team the phones
// are arranged in the number of columns that makes them biggest.
const GAP = 12, LABEL = 46;
function fitPhones(w, h, n) {
  let best = { scale: 0, cols: 1 };
  for (let cols = 1; cols <= n; cols++) {
    const rows = Math.ceil(n / cols);
    const scale = Math.min(1, (w - GAP * (cols - 1)) / (cols * 375), (h - GAP * (rows - 1)) / (rows * 812));
    if (scale > best.scale) best = { scale, cols };
  }
  return best;
}
function layout() {
  const rows = $('rows'), n = phones.filter((p) => p.team === 'A').length || 1;
  const W = rows.clientWidth, H = rows.clientHeight;
  const side = fitPhones((W - 8) / 2 - LABEL - 14, H - 24, n), stack = fitPhones(W - LABEL - 14, (H - 8) / 2 - 24, n);
  const useSide = side.scale >= stack.scale, { scale, cols } = useSide ? side : stack;
  rows.classList.toggle('side', useSide);
  for (const ph of document.querySelectorAll('.phones')) ph.style.gridTemplateColumns = `repeat(${cols}, ${375 * scale}px)`;
  for (const p of phones) {
    p.box.style.width = 375 * scale + 'px'; p.box.style.height = 812 * scale + 'px';
    p.el.style.transform = `scale(${scale})`;
  }
}
window.addEventListener('resize', layout);

function buildPhones() {
  const n = +$('count').value;
  const botPins = new Set(['A', 'B'].flatMap((tm) => state.teams[tm].players.filter((p) => p.bot).map((p) => p.pin)));
  $('rows').innerHTML = ''; phones = [];
  for (const tm of ['A', 'B']) {
    const row = document.createElement('div'); row.className = 'row ' + tm;
    row.innerHTML = `<h2>${teamName(tm)}</h2><div class="phones"></div>`;
    $('rows').appendChild(row);
    const free = state.numbers[tm].filter((pin) => !botPins.has(pin));
    for (let i = 0; i < n && i < free.length; i++) {
      const key = tm + i, name = 'Sim ' + key, pin = free[i];
      try { localStorage.setItem('lb' + GAME + 'sim' + key, JSON.stringify({ pin, name })); } catch {}
      const box = document.createElement('div'); box.className = 'phone';
      const el = document.createElement('iframe'); el.src = `/g/${GAME}/join?sim=${key}`;
      el.addEventListener('load', () => { try {
        const w = el.contentWindow, st = w.document.createElement('style');
        st.textContent = 'body:not(.locked) #keypad { display:grid; } #keypad button.hit { background:#4f6cb0 !important; }'; // a laptop hides the keypad: phones should show it
        w.document.head.appendChild(st);
        Object.defineProperty(w.navigator, 'vibrate', { value: () => false }); // no browser warnings for the phones' vibration
      } catch {} });
      box.appendChild(el);
      box.insertAdjacentHTML('beforeend', `<span class="tag">${name} · ${pin}</span>`);
      row.querySelector('.phones').appendChild(box);
      phones.push({ team: tm, pin, name, el, box, next: 0, joining: 0 });
    }
  }
  layout();
}

// ---------- autopilot: every phone plays like a person would, by pressing its own keypad ----------
function typeCode(w, code) {
  [...code].forEach((d, i) => setTimeout(() => {
    try {
      w.press(d);
      const b = [...w.document.querySelectorAll('#keypad button')].find((x) => x.textContent === d);
      if (b) { b.classList.add('hit'); setTimeout(() => b.classList.remove('hit'), 90); }
    } catch {}
  }, i * 110));
}
function choose(ph, ps) {   // ps: the phone's own game state
  const me = ps.me, mine = ph.team, other = mine === 'A' ? 'B' : 'A';
  const bombCode = (i) => (items.find((c) => c.bomb === i) || {}).code;
  const against = (ps.bombs || []).filter((b) => b.target === mine && !(me.defused || []).includes(b.i));
  if (against.length && Math.random() < 0.03) return bombCode(pick(against).i);   // not every bomb gets defused: some explode
  // bombs get used a lot: whenever the team can pay for one it usually arms an idle bomb, otherwise it saves up coins
  const canPay = !!ps.coins && ps.coins[mine] >= (ps.bombInfo ? ps.bombInfo.cost[mine] : 5);
  if (ps.bombsEnabled && canPay && Math.random() < 0.6) {
    const idle = [0, 1, 2, 3].filter((i) => !(ps.bombs || []).some((b) => b.i === i));
    if (idle.length) return bombCode(pick(idle));
  }
  // keep the two teams level: the team with fewer of its players locked (the one that is winning) collects coins instead of shooting
  const share = (tm) => { const l = state.teams[tm].players; return l.length ? l.filter((p) => p.lockedUntil > state.now || p.out).length / l.length : 0; };
  const lead = share(other) - share(mine);
  const coins = items.filter((c) => c.bomb === undefined);
  if (coins.length && Math.random() > Math.min(0.9, Math.max(0.1, 0.6 - lead * 1.2 - (ps.bombsEnabled && !canPay ? 0.25 : 0)))) return pick(coins).code;
  const mates = state.teams[mine].players.filter((p) => p.pin !== ph.pin && p.lockedUntil > state.now && !p.out);
  if (mates.length && Math.random() < 0.8) return pick(mates).pin;
  const foes = state.teams[other].players.filter((p) => p.lockedUntil <= state.now);
  const all = foes.length ? foes : state.teams[other].players;
  return all.length ? pick(all).pin : null;
}
function pilot() {
  if (!state || !$('pilot').checked) return;
  const speed = +$('speed').value, now = Date.now();
  for (const ph of phones) {
    let w, snap;
    try { w = ph.el.contentWindow; snap = w.eval('({ mode, state, offset, up: socket.connected })'); } catch { continue; }
    if (!snap) continue;
    if (snap.mode === 'join') {   // not in the game (first load, kicked, game reset): join again
      if (now - ph.joining > 4000 && snap.up) { ph.joining = now; try { w.doJoin(ph.pin, ph.name, false); } catch {} }
      continue;
    }
    const ps = snap.state;
    if (!ps || ps.phase !== 'running' || ps.me.out || ps.me.lockedUntil > Date.now() + snap.offset || now < ph.next) continue;
    const sh = (tm) => { const l = state.teams[tm].players; return l.length ? l.filter((p) => p.lockedUntil > state.now || p.out).length / l.length : 0; };
    const behind = Math.min(1.8, Math.max(0.6, 1 + sh(ph.team === 'A' ? 'B' : 'A') - sh(ph.team)));   // the team that is behind plays faster
    ph.next = now + (1500 + Math.random() * 2500) * behind / speed;
    const code = choose(ph, ps);
    if (code) typeCode(w, code);
  }
}
setInterval(pilot, 400);

// ---------- game controls ----------
const emit = (ev, data) => socket.emit(ev, data);
$('startBtn').onclick = () => socket.emit('admin:start', { minutes: +$('mins').value || 1 });
$('endBtn').onclick = () => emit('admin:end');
$('botsBtn').onclick = () => { emit('admin:addBots', { team: 'A', count: 5 }); emit('admin:addBots', { team: 'B', count: 5 }); };
$('clearBtn').onclick = () => emit('admin:removeBots');
$('count').onchange = () => state && buildPhones();

function onState(s) {
  if (s) { state = s; offset = s.now - Date.now(); }
  if (!state) return;
  if (!phones.length) buildPhones();
  if (state.botsBalance !== true) emit('admin:botsBalance', true);   // the simulator keeps the bots balanced too
  renderHead();
  // keep rounds coming so the game can be watched for as long as needed
  if (prevPhase && prevPhase !== 'lobby' && state.phase === 'lobby' && $('auto').checked) setTimeout(() => { if (state && state.phase === 'lobby' && $('auto').checked) $('startBtn').click(); }, 5000);
  prevPhase = state.phase;
}
fetch('/api/coins').then((r) => r.json()).then((c) => { items = c; });
socket.on('connect', () => socket.emit('admin:hello', null, (s) => s && !s.error && onState(s)));
socket.on('state', onState);
keepAlive(socket, (res) => (res.state ? onState(res.state) : socket.emit('admin:hello', null, (s) => s && !s.error && onState(s))));
window.onLangChange = () => { $('gameLbl').textContent = t('game', { n: GAME }); renderHead(); };
</script>
</body>
</html>
